name: Bundle checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked --dev
      - run: uv run python scripts/validate.py
      - run: uv run pytest -q
      - run: uv run ruff check scripts tests
